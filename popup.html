<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Архив Gemini</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-wrap">
      <svg class="gemini-sparkle" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285f4" />
            <stop offset="50%" stop-color="#9b72cb" />
            <stop offset="100%" stop-color="#d96570" />
          </linearGradient>
        </defs>
        <path
          fill="url(#geminiGrad)"
          d="M12 2C12.4 7.2 16.8 11.6 22 12C16.8 12.4 12.4 16.8 12 22C11.6 16.8 7.2 12.4 2 12C7.2 11.6 11.6 7.2 12 2Z"
        />
      </svg>
      <h1>Архив</h1>
      <span id="chat-count" class="count-badge">0</span>
    </div>
    <button id="refresh-btn" class="refresh-btn" type="button" title="Обновить список" aria-label="Обновить список">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
  </header>

  <div class="search-box" id="search-box" hidden>
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Поиск в архиве"
        autocomplete="off"
      />
    </div>
  </div>

  <main id="chat-list-container">
    <div id="status-message" class="status-message">Загрузка архивных чатов…</div>
    <ul id="chat-list" class="chat-list" hidden></ul>
  </main>

  <!-- Контекстное диалоговое окно действий по ПКМ -->
  <div id="context-menu" class="context-menu" role="menu" aria-label="Действия с чатом" hidden>
    <div id="context-menu-title" class="context-menu-title"></div>
    <button id="ctx-open-chat" class="context-menu-item" type="button" role="menuitem">
      <svg class="context-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span>Открыть чат</span>
    </button>
    <button id="ctx-open-new-tab" class="context-menu-item" type="button" role="menuitem">
      <svg class="context-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
      <span>Открыть в новой вкладке</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
